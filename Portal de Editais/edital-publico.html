<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edital Compartilhado | Athos</title>
  <script>
    (function () {
      try {
        const key = 'athos_theme_preference';
        const valid = { light: true, dark: true, system: true };
        let pref = String(localStorage.getItem(key) || 'light').toLowerCase().trim();
        if (!valid[pref]) pref = 'light';
        const effective = pref === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme-preference', pref);
        document.documentElement.setAttribute('data-theme', effective);
      } catch (_) {}
    })();
  </script>
  <meta name="description" content="Visualização pública de edital compartilhado no Athos. Para acessar o restante da plataforma, faça login." />
